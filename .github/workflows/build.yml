name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      !contains(github.event.pull_request.body, '[skip build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.22.1

      - run: yarn install

      - run: yarn build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ROLLBAR_CLIENT_ENV: ${{ secrets.ROLLBAR_CLIENT_ENV }}
          ROLLBAR_CLIENT_ACCESS_TOKEN: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
          ROLLBAR_SERVER_ACCESS_TOKEN: ${{ secrets.ROLLBAR_SERVER_ACCESS_TOKEN }}

      - name: Upload webpack stats artifact
        uses: relative-ci/agent-upload-artifact-action@v2.0.0
        with:
          webpackStatsFile: ./build/client/webpack-stats.json
